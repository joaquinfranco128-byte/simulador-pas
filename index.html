<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simulador PAS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#08111f;color:#eaf2ff}.wrap{max-width:900px;margin:auto;padding:18px}.muted{color:#9fb0c8}.card{background:#111d2f;border:1px solid #263a55;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:#38bdf8;color:#062033}.secondary{background:#1d2c42;color:#eaf2ff;border:1px solid #334b69}.topic{text-align:left;color:#fff}.topic b,.topic span{display:block}.topic span{font-size:13px;color:#aab9ce}.hidden{display:none!important}.opt{width:100%;text-align:left;background:#17263a;color:#fff;border:1px solid #324861;border-radius:13px;padding:14px;margin:9px 0}.opt.sel{outline:2px solid #38bdf8}.opt.good{background:#123a2a;border-color:#4ade80}.opt.bad{background:#431b2a;border-color:#fb7185}.row{display:flex;gap:8px;flex-wrap:wrap}.progress{height:8px;background:#1c2a3d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#38bdf8}.explain{background:#0d2940;border-left:4px solid #38bdf8;padding:12px;border-radius:8px;margin-top:10px}.pill{display:inline-block;background:#1c3049;border-radius:99px;padding:6px 10px;font-size:12px}.big{font-size:38px;font-weight:800}select{background:#17263a;color:white;border:1px solid #334b69;border-radius:10px;padding:11px}.status{font-size:12px;color:#4ade80}</style></head><body><div class="wrap"><section id="home"><h1>Simulador PAS</h1><p class="muted">Tests por tema · test general aleatorio · explicación de todas las respuestas</p><p id="status" class="status">✓ Simulador cargado</p><div class="card"><h2>🎲 Test general</h2><p class="muted">Mezcla preguntas de todos los temas.</p><div class="row"><select id="num"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="999">Todas</option></select><button id="startGeneral" class="btn">Empezar test</button></div></div><h2>📚 Practicar por tema</h2><div id="topics" class="grid"></div></section><section id="quiz" class="hidden"><div class="row"><button id="exit" class="btn secondary">← Salir</button><span id="tag" class="pill"></span></div><h2 id="title"></h2><div class="progress"><i id="bar"></i></div><p id="counter" class="muted"></p><div class="card"><h3 id="question"></h3><div id="options"></div><div id="feedback" class="explain hidden"></div></div><div class="row"><button id="checkBtn" class="btn">Corregir</button><button id="nextBtn" class="btn hidden">Siguiente →</button></div></section><section id="result" class="hidden"><button id="backHome" class="btn secondary">← Inicio</button><div class="card"><div id="score" class="big"></div><p id="scoreText"></p><div class="row"><button class="btn reviewBtn" data-mode="all">Todas</button><button class="btn secondary reviewBtn" data-mode="bad">Errores</button><button class="btn secondary reviewBtn" data-mode="good">Correctas</button></div></div><div id="reviews"></div></section></div><script>
const Q=[
['Marco legal','¿Qué ley regula principalmente la actividad y funcionamiento de las entidades aseguradoras?',['Ley 17.418','Ley 20.091','Ley 22.400','Ley 24.557'],1,'La Ley 20.091 regula las entidades aseguradoras y su control.'],
['Marco legal','La SSN es presentada en el material como:',['Una entidad autárquica de control','Una dependencia del BCRA','Una aseguradora estatal','Una asociación privada'],0,'La Superintendencia de Seguros de la Nación es la autoridad de control de la actividad aseguradora.'],
['Aseguradoras y SSN','Las reservas técnicas tienen como finalidad principal:',['Pagar publicidad','Respaldar obligaciones derivadas de los contratos de seguro','Pagar comisiones exclusivamente','Reemplazar el capital social'],1,'Las reservas técnicas respaldan obligaciones vinculadas con riesgos y siniestros asumidos.'],
['Aseguradoras y SSN','IBNR significa:',['Prima no cobrada','Siniestros ocurridos pero no reportados','Inversión bancaria no registrada','Índice de reaseguro'],1,'IBNR significa Incurred But Not Reported: siniestros ocurridos que todavía no fueron denunciados.'],
['PAS - Ley 22.400','La función principal del PAS es:',['Intermediar y asesorar a asegurados y asegurables','Liquidar judicialmente siniestros','Fijar primas del mercado','Fiscalizar aseguradoras'],0,'La Ley 22.400 caracteriza la actividad por la intermediación y el asesoramiento.'],
['PAS - Ley 22.400','Como regla, ¿cuándo nace el derecho del PAS a la comisión?',['Al cotizar','Cuando la aseguradora percibe efectivamente la prima o cuota','Al entregar una tarjeta','Al denunciar el siniestro'],1,'El derecho a comisión se vincula con la percepción efectiva de la prima por la aseguradora.'],
['PAS - Ley 22.400','Una persona no inscripta en el registro correspondiente:',['Puede cobrar comisión','No tiene derecho a comisión por concertación de seguros','Puede usar la matrícula de otro PAS','Puede operar libremente'],1,'La intermediación remunerada está reservada a personas habilitadas.'],
['PAS - Ley 22.400','Durante una suspensión de matrícula, el PAS:',['Puede seguir intermediando','Está impedido de ejercer la actividad propia de intermediación','Solo puede vender automotores','Puede emitir con otra matrícula'],1,'La suspensión impide ejercer la actividad profesional alcanzada.'],
['Contrato - Ley 17.418','La reticencia comprende:',['Solo falta de pago','Declaración falsa u omisión de circunstancias conocidas relevantes para apreciar el riesgo','Solo denunciar tarde','Contratar dos pólizas'],1,'La reticencia se refiere a circunstancias conocidas que habrían impedido el contrato o modificado sus condiciones.'],
['Contrato - Ley 17.418','Conocida la reticencia, el plazo indicado para impugnar el contrato es:',['3 días','30 días','3 meses','3 años'],2,'El material reproduce un plazo de tres meses desde el conocimiento de la reticencia o falsedad.'],
['Contrato - Ley 17.418','En Primer Riesgo Absoluto:',['Siempre se aplica prorrata','Se indemniza hasta la suma asegurada sin regla proporcional por infraseguro','Nunca se cubre daño total','Se paga valor fiscal'],1,'En Primer Riesgo Absoluto no se aplica la regla proporcional por infraseguro.'],
['Contrato - Ley 17.418','Si una cobertura es a prorrata y existe infraseguro:',['Se paga siempre todo','La indemnización se reduce proporcionalmente','La póliza se anula','Se duplica la prima'],1,'La relación entre suma asegurada y valor asegurable determina la proporción indemnizable.'],
['Contrato - Ley 17.418','Hay sobreseguro cuando:',['La suma asegurada es menor al valor','La suma asegurada supera el valor asegurable','No existe franquicia','Hay dos beneficiarios'],1,'El sobreseguro aparece cuando la suma asegurada excede el valor del interés asegurado.'],
['Siniestros','La carga de salvamento exige al asegurado:',['Esperar sin actuar','Tomar medidas razonables para evitar o disminuir el daño','Abandonar siempre los restos','Pagar otra prima'],1,'El asegurado debe actuar razonablemente para impedir que el daño se produzca o agrave.'],
['Siniestros','Si el asegurador rechaza un siniestro, el rechazo debe ser:',['Solo verbal','Fehaciente y fundado','Informado únicamente al PAS','Sin explicación'],1,'El rechazo debe comunicarse fehacientemente y con fundamentos claros.'],
['Siniestros','Los gastos necesarios para verificar el siniestro y liquidar el daño son, como regla, a cargo de:',['El asegurador','El PAS','El asegurado siempre','El tercero'],0,'La verificación y liquidación forman parte del proceso a cargo del asegurador.'],
['Robo','La diferencia central entre robo y hurto es que el robo:',['Solo ocurre de noche','Supone fuerza en las cosas o violencia en las personas','Requiere arma','Solo afecta dinero'],1,'La distinción se basa en la fuerza en las cosas o violencia en las personas.'],
['Robo','El material de Robo contempla como medidas de prestación:',['Solo prorrata','Prorrata, Primer Riesgo Absoluto y Primer Riesgo Relativo','Solo valor tasado','Ninguna'],1,'El módulo enumera esas tres medidas de prestación.'],
['Incendio','La cobertura de incendio puede incluir:',['Daños directos y determinados daños indirectos vinculados al evento','Solo multas','Solo RC','Solo robo'],0,'El módulo desarrolla daños directos e indirectos vinculados al incendio.'],
['Incendio','Una pared dañada razonablemente para extinguir un incendio puede considerarse:',['Daño vinculado a medidas de extinción/salvamento','Hurto','Reticencia','Franquicia'],0,'Las medidas razonables para combatir o limitar el incendio pueden generar daños comprendidos según la cobertura.'],
['Responsabilidad Civil','Ser civilmente responsable implica principalmente:',['Estar obligado a reparar el perjuicio causado a otro','Tener responsabilidad penal siempre','Ser asegurador','Pagar una multa'],0,'La responsabilidad civil gira en torno a la reparación del daño causado.'],
['Responsabilidad Civil','La teoría del riesgo pone especial atención en:',['Quien introduce una cosa o actividad apta para causar daños','Solo la víctima','Solo el juez','El PAS'],0,'El material explica la objetivación de responsabilidad a partir del riesgo creado.'],
['Automotores','La franquicia es:',['La parte del daño que queda a cargo del asegurado','La comisión del PAS','Un impuesto','La prima anual'],0,'La franquicia es la porción del daño que contractualmente queda a cargo del asegurado.'],
['Automotores','Participar en certámenes o pruebas de velocidad puede constituir:',['Ampliación automática','Exclusión de cobertura','Salvamento','Seguro pleno'],1,'Las condiciones de automotores contemplan exclusiones vinculadas con competencias o pruebas de velocidad.'],
['Automotores','La RC básica tiene por objeto principalmente:',['Daños propios','Responsabilidad por daños causados a terceros dentro de los términos de cobertura','Mantenimiento mecánico','Multas'],1,'La responsabilidad civil automotor se orienta a daños ocasionados a terceros.'],
['Aeronavegación','Según el material de casco aeronáutico, se considera pérdida total cuando los daños superan aproximadamente:',['25%','50%','85%','100% únicamente'],2,'El módulo utiliza el umbral del 85% del valor de la aeronave.'],
['Aeronavegación','El material contempla como supuesto de pérdida total la falta de noticias durante:',['3 días','1 mes','3 meses','1 año'],2,'El módulo contempla la desaparición durante tres meses.'],
['Fraude y prevención','Fraude al seguro es:',['Un error involuntario','Engañar deliberadamente para obtener un beneficio ilícito','No recordar la póliza','Pedir cotización'],1,'El elemento central es el engaño deliberado para obtener una ventaja indebida.'],
['Fraude y prevención','Las campañas de prevención de fraude buscan:',['Eliminar clientes','Proteger la mutualidad y reducir costos siniestrales injustificados','Aumentar impuestos','Eliminar coberturas'],1,'El fraude perjudica al conjunto de asegurados y a la sustentabilidad del sistema.'],
['Ética PAS','Prometer al cliente una cobertura que la póliza no contiene vulnera:',['El deber de información y buena fe','La seguridad vial','La franquicia','El capital mínimo'],0,'El PAS debe informar correctamente el alcance real de las coberturas.'],
['Seguridad vial','La seguridad vial debe entenderse en la formación del PAS como:',['Algo ajeno al seguro','Parte de una cultura de prevención','Una cobertura automática','Un impuesto'],1,'El material incorpora la prevención y seguridad vial como parte de la gestión responsable del riesgo.'],
['Principios técnicos','El seguro pleno se configura cuando:',['La suma asegurada coincide con el valor asegurable','No existe prima','Hay dos aseguradoras','No existe riesgo'],0,'En seguro pleno la suma asegurada coincide con el valor asegurable.'],
['Principios técnicos','El principio indemnizatorio busca evitar que el seguro patrimonial:',['Pague siniestros','Se convierta en fuente de enriquecimiento para el asegurado','Tenga franquicia','Use reaseguro'],1,'La indemnización procura reparar el perjuicio, no generar enriquecimiento.'],
['Principios técnicos','El reaseguro permite al asegurador:',['Eliminar toda obligación','Transferir parte de los riesgos asumidos a otro asegurador especializado','Cobrar al tercero','Reemplazar al PAS'],1,'El reaseguro distribuye parte del riesgo asumido por la aseguradora.']
];
let quiz=[],idx=0,chosen=null,answers=[];const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);function show(id){['home','quiz','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function renderTopics(){const counts={};Q.forEach(q=>counts[q[0]]=(counts[q[0]]||0)+1);const box=$('topics');box.innerHTML='';Object.entries(counts).sort().forEach(([t,n])=>{const b=document.createElement('button');b.className='card topic';b.innerHTML='<b>'+t+'</b><span>'+n+' preguntas · tocar para practicar</span>';b.addEventListener('click',()=>startTopic(t));box.appendChild(b)})}function startAll(){let n=Number($('num').value);quiz=shuffle(Q);if(n!==999)quiz=quiz.slice(0,Math.min(n,quiz.length));begin('Test general aleatorio')}function startTopic(t){quiz=shuffle(Q.filter(q=>q[0]===t));begin(t)}function begin(t){idx=0;answers=[];chosen=null;$('title').textContent=t;show('quiz');render()}function render(){const q=quiz[idx];chosen=null;$('tag').textContent=q[0];$('counter').textContent='Pregunta '+(idx+1)+' de '+quiz.length;$('bar').style.width=((idx+1)/quiz.length*100)+'%';$('question').textContent=q[1];const box=$('options');box.innerHTML='';q[2].forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+') '+o;b.addEventListener('click',()=>pick(i,b));box.appendChild(b)});$('feedback').classList.add('hidden');$('checkBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden')}function pick(i,b){chosen=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function checkAnswer(){if(chosen===null){alert('Elegí una respuesta.');return}const q=quiz[idx],ok=chosen===q[3];answers.push({q,chosen,ok});document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('good');if(i===chosen&&!ok)b.classList.add('bad')});$('feedback').innerHTML='<b>'+(ok?'✓ Correcto':'✗ Incorrecto')+'</b><br>'+q[4];$('feedback').classList.remove('hidden');$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=idx===quiz.length-1?'Ver resultado':'Siguiente →'}function nextQuestion(){if(idx<quiz.length-1){idx++;render()}else finish()}function finish(){const n=answers.filter(a=>a.ok).length,p=Math.round(n/answers.length*100);$('score').textContent=n+'/'+answers.length+' — '+p+'%';$('scoreText').textContent=p>=80?'Muy buen resultado. Revisá también las correctas dudosas para fijar conceptos.':p>=60?'Vas bien. Conviene revisar los errores.':'Conviene repasar las explicaciones y volver a intentar por tema.';show('result');review('all')}function review(mode){const a=answers.filter(x=>mode==='all'||(mode==='bad'&&!x.ok)||(mode==='good'&&x.ok));$('reviews').innerHTML='';a.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML='<span class="pill">'+x.q[0]+'</span><h3>'+x.q[1]+'</h3><p><b>Tu respuesta:</b> '+String.fromCharCode(65+x.chosen)+') '+x.q[2][x.chosen]+'</p><p><b>Correcta:</b> '+String.fromCharCode(65+x.q[3])+') '+x.q[2][x.q[3]]+'</p><div class="explain"><b>Por qué:</b> '+x.q[4]+'</div>'; $('reviews').appendChild(d)});if(!a.length)$('reviews').innerHTML='<div class="card">No hay preguntas en esta categoría.</div>'}function goHome(){show('home');renderTopics()}$('startGeneral').addEventListener('click',startAll);$('exit').addEventListener('click',goHome);$('backHome').addEventListener('click',goHome);$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQuestion);document.querySelectorAll('.reviewBtn').forEach(b=>b.addEventListener('click',()=>review(b.dataset.mode)));renderTopics();</script></body></html>

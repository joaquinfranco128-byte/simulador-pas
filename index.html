<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simulador PAS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#08111f;color:#eaf2ff}.wrap{max-width:920px;margin:auto;padding:18px}.muted{color:#9fb0c8}.status{color:#4ade80;font-size:13px}.card{background:#111d2f;border:1px solid #263a55;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:10px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:#38bdf8;color:#062033}.secondary{background:#1d2c42;color:#eaf2ff;border:1px solid #334b69}.topic{text-align:left;color:#fff}.topic b,.topic span{display:block}.topic span{font-size:13px;color:#aab9ce}.hidden{display:none!important}.opt{width:100%;text-align:left;background:#17263a;color:#fff;border:1px solid #324861;border-radius:13px;padding:14px;margin:9px 0;font-size:15px}.opt.sel{outline:2px solid #38bdf8}.opt.good{background:#123a2a;border-color:#4ade80}.opt.bad{background:#431b2a;border-color:#fb7185}.row{display:flex;gap:8px;flex-wrap:wrap}.progress{height:8px;background:#1c2a3d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#38bdf8}.explain{background:#0d2940;border-left:4px solid #38bdf8;padding:12px;border-radius:8px;margin-top:10px;line-height:1.45}.pill{display:inline-block;background:#1c3049;border-radius:99px;padding:6px 10px;font-size:12px}.big{font-size:38px;font-weight:800}select{background:#17263a;color:white;border:1px solid #334b69;border-radius:10px;padding:11px}.count{font-weight:800;color:#7dd3fc}</style></head><body><div class="wrap"><section id="home"><h1>Simulador PAS</h1><p class="muted">Dificultad media/alta · casos prácticos · distractores plausibles · explicación completa</p><p class="status">✓ Banco actualizado: <span id="poolCount" class="count"></span> preguntas</p><div class="card"><h2>🎲 Test general aleatorio</h2><p class="muted">Mezcla todos los temas del banco.</p><div class="row"><select id="num"><option value="10">10 preguntas</option><option value="20" selected>20 preguntas</option><option value="30">30 preguntas</option><option value="50">50 preguntas</option><option value="999">Todas</option></select><button id="startGeneral" class="btn">Empezar test</button></div></div><h2>📚 Practicar por tema</h2><div id="topics" class="grid"></div></section><section id="quiz" class="hidden"><div class="row"><button id="exit" class="btn secondary">← Salir</button><span id="tag" class="pill"></span></div><h2 id="title"></h2><div class="progress"><i id="bar"></i></div><p id="counter" class="muted"></p><div class="card"><h3 id="question"></h3><div id="options"></div><div id="feedback" class="explain hidden"></div></div><div class="row"><button id="checkBtn" class="btn">Corregir</button><button id="nextBtn" class="btn hidden">Siguiente →</button></div></section><section id="result" class="hidden"><button id="backHome" class="btn secondary">← Inicio</button><div class="card"><div id="score" class="big"></div><p id="scoreText"></p><div class="row"><button class="btn reviewBtn" data-mode="all">Revisar todas</button><button class="btn secondary reviewBtn" data-mode="bad">Solo errores</button><button class="btn secondary reviewBtn" data-mode="good">Solo correctas</button></div></div><div id="reviews"></div></section></div><script src="questions.js"></script><script>
const Q=window.PAS_QUESTIONS||[];let quiz=[],idx=0,chosen=null,answers=[];const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);function show(id){['home','quiz','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function renderTopics(){const counts={};Q.forEach(q=>counts[q[0]]=(counts[q[0]]||0)+1);$('poolCount').textContent=Q.length;const box=$('topics');box.innerHTML='';Object.entries(counts).sort().forEach(([t,n])=>{const b=document.createElement('button');b.className='card topic';b.innerHTML='<b>'+t+'</b><span>'+n+' preguntas</span>';b.addEventListener('click',()=>startTopic(t));box.appendChild(b)})}function startAll(){let n=Number($('num').value);quiz=shuffle(Q);if(n!==999)quiz=quiz.slice(0,Math.min(n,quiz.length));begin('Test general aleatorio')}function startTopic(t){quiz=shuffle(Q.filter(q=>q[0]===t));begin(t)}function begin(t){if(!quiz.length)return alert('No hay preguntas disponibles.');idx=0;answers=[];chosen=null;$('title').textContent=t;show('quiz');render()}function render(){const q=quiz[idx];chosen=null;$('tag').textContent=q[0];$('counter').textContent='Pregunta '+(idx+1)+' de '+quiz.length;$('bar').style.width=((idx+1)/quiz.length*100)+'%';$('question').textContent=q[1];const box=$('options');box.innerHTML='';q[2].forEach((text,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+') '+text;b.addEventListener('click',()=>{chosen=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});box.appendChild(b)});$('feedback').classList.add('hidden');$('checkBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden')}function checkAnswer(){if(chosen===null)return alert('Elegí una respuesta.');const q=quiz[idx],ok=chosen===q[3];answers.push({q,chosen,ok});document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('good');if(i===chosen&&!ok)b.classList.add('bad')});$('feedback').innerHTML='<b>'+(ok?'✓ Correcto':'✗ Incorrecto')+'</b><br>'+q[4];$('feedback').classList.remove('hidden');$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=idx===quiz.length-1?'Ver resultado':'Siguiente →'}function nextQ(){if(idx<quiz.length-1){idx++;render()}else finish()}function finish(){const c=answers.filter(a=>a.ok).length,p=Math.round(c/answers.length*100);$('score').textContent=c+'/'+answers.length+' — '+p+'%';$('scoreText').textContent=p>=85?'Muy buen nivel. Revisá incluso las correctas que te hayan generado duda.':p>=70?'Buen nivel, pero todavía hay conceptos finos para reforzar.':'Conviene revisar las explicaciones y repetir los temas más flojos.';show('result');review('all')}function review(mode){const arr=answers.filter(x=>mode==='all'||(mode==='bad'&&!x.ok)||(mode==='good'&&x.ok));$('reviews').innerHTML=arr.map(x=>'<div class="card"><span class="pill">'+x.q[0]+'</span><h3>'+x.q[1]+'</h3><p><b>Tu respuesta:</b> '+String.fromCharCode(65+x.chosen)+') '+x.q[2][x.chosen]+'</p><p><b>Correcta:</b> '+String.fromCharCode(65+x.q[3])+') '+x.q[2][x.q[3]]+'</p><div class="explain"><b>Por qué:</b> '+x.q[4]+'</div></div>').join('')||'<div class="card">No hay preguntas en esta categoría.</div>'}function goHome(){show('home');renderTopics()}$('startGeneral').addEventListener('click',startAll);$('exit').addEventListener('click',goHome);$('backHome').addEventListener('click',goHome);$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQ);document.querySelectorAll('.reviewBtn').forEach(b=>b.addEventListener('click',()=>review(b.dataset.mode)));renderTopics();
</script></body></html>

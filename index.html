<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simulador PAS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#08111f;color:#eaf2ff}.wrap{max-width:900px;margin:auto;padding:18px}.muted{color:#9fb0c8}.card{background:#111d2f;border:1px solid #263a55;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:#38bdf8;color:#062033}.secondary{background:#1d2c42;color:#eaf2ff;border:1px solid #334b69}.topic{text-align:left;color:#fff}.topic b,.topic span{display:block}.topic span{font-size:13px;color:#aab9ce}.hidden{display:none!important}.opt{width:100%;text-align:left;background:#17263a;color:#fff;border:1px solid #324861;border-radius:13px;padding:14px;margin:9px 0}.opt.sel{outline:2px solid #38bdf8}.good{background:#123a2a!important;border-color:#4ade80!important}.bad{background:#431b2a!important;border-color:#fb7185!important}.row{display:flex;gap:8px;flex-wrap:wrap}.progress{height:8px;background:#1c2a3d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#38bdf8}.explain{background:#0d2940;border-left:4px solid #38bdf8;padding:12px;border-radius:8px;margin-top:10px}.pill{display:inline-block;background:#1c3049;border-radius:99px;padding:6px 10px;font-size:12px}.big{font-size:38px;font-weight:800}select{background:#17263a;color:white;border:1px solid #334b69;border-radius:10px;padding:11px}</style></head><body><div class="wrap"><section id="home"><h1>Simulador PAS</h1><p class="muted">Versión por temas · test general aleatorio · explicación de respuestas</p><div class="card"><h2>🎲 Test general</h2><p class="muted">Preguntas aleatorias mezclando todos los temas.</p><div class="row"><select id="num"><option>10</option><option selected>20</option><option>30</option><option value="999">Todas</option></select><button class="btn" onclick="startAll()">Empezar</button></div></div><h2>📚 Practicar por tema</h2><div id="topics" class="grid"></div></section><section id="quiz" class="hidden"><div class="row"><button class="btn secondary" onclick="home()">← Salir</button><span id="tag" class="pill"></span></div><h2 id="title"></h2><div class="progress"><i id="bar"></i></div><p id="counter" class="muted"></p><div class="card"><h3 id="question"></h3><div id="options"></div><div id="feedback" class="explain hidden"></div></div><div class="row"><button id="check" class="btn" onclick="check()">Corregir</button><button id="next" class="btn hidden" onclick="next()">Siguiente →</button></div></section><section id="result" class="hidden"><button class="btn secondary" onclick="home()">← Inicio</button><div class="card"><div id="score" class="big"></div><p id="scoreText"></p><div class="row"><button class="btn" onclick="review('all')">Todas</button><button class="btn secondary" onclick="review('bad')">Errores</button><button class="btn secondary" onclick="review('good')">Correctas</button></div></div><div id="reviews"></div></section></div><script>
const Q=[
['Marco legal','¿Qué ley regula principalmente la actividad y funcionamiento de las entidades aseguradoras?',['Ley 17.418','Ley 20.091','Ley 22.400','Ley 24.557'],1,'La Ley 20.091 regula las entidades aseguradoras y su control. La 17.418 regula el contrato y la 22.400 la actividad del PAS.'],
['Marco legal','La SSN es presentada en el material como:',['Una entidad autárquica de control','Una dependencia del BCRA','Una aseguradora estatal','Una asociación privada'],0,'La Superintendencia de Seguros de la Nación es la autoridad de control de la actividad aseguradora.'],
['Aseguradoras y SSN','Ante una pérdida relevante del capital mínimo, la SSN puede:',['Ignorarla hasta fin de año','Imponer medidas de regularización y limitar nuevas operaciones','Eliminar las reservas','Transferir automáticamente la empresa'],1,'El régimen contempla medidas para recomponer la situación patrimonial y proteger a asegurados y beneficiarios.'],
['Aseguradoras y SSN','Las reservas técnicas tienen como finalidad principal:',['Pagar publicidad','Respaldar obligaciones derivadas de los contratos de seguro','Pagar comisiones futuras exclusivamente','Reemplazar el capital social'],1,'Las reservas técnicas representan obligaciones vinculadas con riesgos y siniestros asumidos.'],
['Aseguradoras y SSN','IBNR significa:',['Prima no cobrada','Siniestros ocurridos pero no reportados','Inversión bancaria no registrada','Índice básico nacional de reaseguro'],1,'IBNR significa Incurred But Not Reported: siniestros ocurridos que todavía no fueron denunciados.'],
['PAS - Ley 22.400','La función principal del PAS es:',['Intermediar y asesorar a asegurados y asegurables','Liquidar judicialmente siniestros','Fijar las primas del mercado','Fiscalizar aseguradoras'],0,'La Ley 22.400 caracteriza la actividad por la intermediación y el asesoramiento.'],
['PAS - Ley 22.400','Como regla, ¿cuándo nace el derecho del PAS a la comisión?',['Al cotizar','Cuando la aseguradora percibe efectivamente la prima o cuota','Al entregar una tarjeta','Al denunciar el siniestro'],1,'El material vincula el derecho a comisión con la percepción efectiva de la prima por la aseguradora.'],
['PAS - Ley 22.400','Una persona no inscripta en el registro correspondiente:',['Puede cobrar comisión normalmente','No tiene derecho a comisión por concertación de seguros','Puede operar si conoce al cliente','Puede usar la matrícula de otro PAS'],1,'La intermediación remunerada está reservada a personas habilitadas.'],
['PAS - Ley 22.400','Durante una suspensión de matrícula, el PAS:',['Puede seguir intermediando','Está impedido de ejercer la actividad propia de intermediación','Solo puede vender automotores','Puede emitir usando otra matrícula'],1,'La suspensión impide ejercer la actividad profesional alcanzada.'],
['PAS - Ley 22.400','El Registro de Operaciones del PAS se lleva actualmente, según el material, mediante:',['Hojas sueltas','Rúbrica Digital','Un cuaderno sin rubricar','No existe registro obligatorio'],1,'El material de actividad del PAS contempla el Registro de Operaciones mediante Rúbrica Digital.'],
['Contrato - Ley 17.418','La reticencia comprende:',['Solo la falta de pago','Declaración falsa u omisión de circunstancias conocidas relevantes para apreciar el riesgo','Solo denunciar tarde','Contratar dos pólizas'],1,'La reticencia se refiere a circunstancias conocidas que, de haberse informado, habrían impedido el contrato o modificado sus condiciones.'],
['Contrato - Ley 17.418','Según el material, conocido un supuesto de reticencia, el asegurador dispone para impugnar el contrato de:',['3 días','30 días','3 meses','3 años'],2,'El material reproduce el plazo de tres meses desde el conocimiento de la reticencia o falsedad.'],
['Contrato - Ley 17.418','En Primer Riesgo Absoluto:',['Siempre se aplica prorrata','Se indemniza hasta la suma asegurada sin regla proporcional por infraseguro','Nunca se cubre un daño total','Se paga el valor fiscal'],1,'En Primer Riesgo Absoluto no se aplica la regla proporcional por infraseguro.'],
['Contrato - Ley 17.418','Si una cobertura es a prorrata y existe infraseguro:',['Se paga siempre todo','La indemnización se reduce proporcionalmente','La póliza queda automáticamente anulada','Se duplica la prima'],1,'La relación entre suma asegurada y valor asegurable determina la proporción indemnizable.'],
['Contrato - Ley 17.418','Hay sobreseguro cuando:',['La suma asegurada es menor al valor','La suma asegurada supera el valor asegurable','No existe franquicia','Hay más de un beneficiario'],1,'El sobreseguro aparece cuando la suma asegurada excede el valor del interés asegurado.'],
['Siniestros','La carga de salvamento exige al asegurado:',['Esperar sin actuar','Tomar medidas razonables para evitar o disminuir el daño','Abandonar siempre los restos','Pagar otra prima'],1,'El asegurado debe actuar razonablemente para impedir que el daño se produzca o agrave.'],
['Siniestros','Si el asegurador rechaza un siniestro, el material exige que el rechazo sea:',['Solo verbal','Fehaciente y fundado','Informado únicamente al PAS','Sin explicación'],1,'El rechazo debe comunicarse fehacientemente y con fundamentos claros.'],
['Siniestros','Los gastos necesarios para verificar el siniestro y liquidar el daño son, como regla, a cargo de:',['El asegurador','El PAS','El asegurado siempre','El tercero'],0,'La verificación y liquidación forman parte del proceso a cargo del asegurador, con las excepciones previstas.'],
['Siniestros','Si el asegurador guarda silencio durante el plazo legal luego de contar con la información necesaria:',['Implica rechazo','Puede operar la aceptación del derecho del asegurado','Anula la póliza','Duplica el plazo automáticamente'],1,'El material estudia el efecto del silencio del asegurador dentro del régimen de pronunciamiento sobre el siniestro.'],
['Robo','La diferencia central entre robo y hurto es que el robo:',['Solo ocurre de noche','Supone fuerza en las cosas o violencia en las personas','Requiere arma','Solo afecta dinero'],1,'La distinción se basa en la fuerza en las cosas o violencia en las personas.'],
['Robo','El material de Robo contempla como medidas de prestación:',['Solo prorrata','Prorrata, Primer Riesgo Absoluto y Primer Riesgo Relativo','Solo valor tasado','Ninguna'],1,'El módulo enumera esas tres medidas de prestación.'],
['Robo','Si un objeto robado ya no se fabrica, puede tomarse como referencia:',['Valor cero','Un modelo similar comparable en uso y antigüedad','Solo el precio original','El valor sentimental'],1,'El material propone considerar un modelo comparable cuando el bien ya no se fabrica.'],
['Incendio','La cobertura de incendio no se limita necesariamente a la llama, sino que puede incluir:',['Daños directos y determinados daños indirectos vinculados al evento','Solo multas','Solo RC','Solo robo'],0,'El módulo desarrolla daños directos e indirectos vinculados al incendio.'],
['Incendio','Una pared dañada razonablemente para extinguir un incendio puede considerarse:',['Daño vinculado a las medidas de extinción/salvamento','Hurto','Reticencia','Franquicia'],0,'Los daños razonablemente causados para combatir o limitar el incendio pueden quedar comprendidos según la cobertura.'],
['Responsabilidad Civil','Ser civilmente responsable implica principalmente:',['Estar obligado a reparar el perjuicio causado a otro','Tener responsabilidad penal siempre','Ser asegurador','Pagar una multa administrativa'],0,'La responsabilidad civil gira en torno a la reparación del daño causado.'],
['Responsabilidad Civil','La teoría del riesgo pone especial atención en:',['Quien introduce una cosa o actividad apta para causar daños','Solo la víctima','Solo el juez','El PAS'],0,'El material explica la objetivación de responsabilidad a partir del riesgo creado.'],
['Responsabilidad Civil','En una cobertura a Primer Riesgo Absoluto:',['Se aplica proporcionalidad con el valor total','Se indemniza el daño hasta el límite contratado sin prorrata','Nunca se cubren animales','Solo se cubre incendio'],1,'Primer Riesgo Absoluto evita la regla proporcional por infraseguro.'],
['Automotores','La franquicia es:',['La parte del daño que queda a cargo del asegurado','La comisión del PAS','Un impuesto','La prima anual'],0,'La franquicia es la porción del daño que contractualmente queda a cargo del asegurado.'],
['Automotores','Participar en certámenes o pruebas de velocidad puede constituir:',['Ampliación automática','Exclusión de cobertura','Salvamento','Seguro pleno'],1,'Las condiciones de automotores contemplan exclusiones vinculadas con competencias o pruebas de velocidad.'],
['Automotores','Vehículos Expuestos a Riesgo se relaciona con:',['Autos vendidos','La exposición de los vehículos asegurados durante el período según días de cobertura','Cantidad de talleres','Cantidad de PAS'],1,'El indicador considera la exposición efectiva al riesgo durante el período analizado.'],
['Automotores','La RC básica tiene por objeto principalmente:',['Daños propios del vehículo','Responsabilidad por daños causados a terceros dentro de los términos de cobertura','Mantenimiento mecánico','Multas de tránsito'],1,'La responsabilidad civil automotor se orienta a los daños ocasionados a terceros, no a daños propios.'],
['Aeronavegación','Según el material de casco aeronáutico, se considera pérdida total cuando los daños superan aproximadamente:',['25%','50%','85%','Solo 100%'],2,'El módulo utiliza el umbral del 85% del valor de la aeronave.'],
['Aeronavegación','El material contempla como supuesto de pérdida total la falta de noticias de la aeronave durante:',['3 días','1 mes','3 meses','1 año'],2,'El módulo contempla la desaparición durante tres meses.'],
['Aeronavegación','Una aeronave sin certificado de aeronavegabilidad figura como:',['Cobertura adicional','Exclusión','Franquicia','Beneficio'],1,'El certificado de aeronavegabilidad es relevante para la cobertura y su ausencia aparece entre las exclusiones estudiadas.'],
['Fraude y prevención','Fraude al seguro es:',['Un error involuntario','Engañar deliberadamente para obtener un beneficio ilícito','No recordar la póliza','Pedir una cotización'],1,'El elemento central es el engaño deliberado orientado a obtener una ventaja indebida.'],
['Fraude y prevención','Si asegurado y PAS alteran deliberadamente los hechos de un siniestro para cobrar más:',['Es una práctica comercial','Existe una conducta fraudulenta y participación del PAS','Solo hay error administrativo','No pasa nada si hay cobertura'],1,'Modificar intencionalmente los hechos para obtener una indemnización indebida constituye fraude.'],
['Fraude y prevención','Las campañas de prevención de fraude buscan:',['Eliminar clientes','Proteger la mutualidad y reducir costos siniestrales injustificados','Aumentar impuestos','Eliminar coberturas'],1,'El fraude perjudica al conjunto de asegurados y a la sustentabilidad del sistema.'],
['Ética PAS','Prometer al cliente una cobertura que la póliza no contiene vulnera especialmente:',['El deber de información y buena fe','La seguridad vial','La franquicia','El capital mínimo'],0,'El PAS debe asesorar e informar correctamente sobre el alcance real de las coberturas.'],
['Ética PAS','Cambiar a un cliente de compañía sin su conformidad solo para obtener mayor comisión es:',['Una práctica correcta','Contrario al deber de asesoramiento y a la ética profesional','Obligatorio','Una forma de reaseguro'],1,'El interés y consentimiento del cliente deben prevalecer frente al interés económico del intermediario.'],
['Seguridad vial','La seguridad vial debe entenderse en la formación del PAS como:',['Algo ajeno al seguro','Parte de una cultura de prevención','Una cobertura automática','Un impuesto'],1,'El material incorpora la prevención y la seguridad vial como parte de la gestión responsable del riesgo.'],
['Principios técnicos','El seguro pleno se configura cuando:',['La suma asegurada coincide con el valor asegurable','No existe prima','Hay dos aseguradoras','No existe riesgo'],0,'En seguro pleno la suma asegurada coincide con el valor asegurable.'],
['Principios técnicos','El principio indemnizatorio busca evitar que el seguro patrimonial:',['Pague siniestros','Se convierta en una fuente de enriquecimiento para el asegurado','Tenga franquicia','Use reaseguro'],1,'La indemnización procura reparar el perjuicio dentro de los límites del contrato, no generar enriquecimiento.'],
['Principios técnicos','El reaseguro permite principalmente al asegurador:',['Eliminar toda obligación','Transferir parte de los riesgos asumidos a otro asegurador especializado','Cobrar directamente al tercero','Reemplazar al PAS'],1,'El reaseguro distribuye o transfiere parte del riesgo asumido por la aseguradora.'],
['Principios técnicos','El riesgo asegurable debe presentar, entre otras características:',['Certeza absoluta de ocurrencia','Posibilidad de ocurrencia e incertidumbre respecto del siniestro','Beneficio garantizado','Ausencia total de interés'],1,'El seguro presupone incertidumbre: si el evento ya ocurrió o es imposible, falta el riesgo asegurable.'],
['Principios técnicos','Si al contratar el siniestro ya se produjo o desapareció la posibilidad de que ocurra:',['El contrato conserva siempre plena validez','Falta el riesgo necesario para el contrato','Se transforma en reaseguro','Solo aumenta la prima'],1,'La existencia del riesgo es un elemento esencial del contrato de seguro.']
];
let quiz=[],idx=0,chosen=null,answers=[];const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);function show(id){['home','quiz','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function renderTopics(){let m={};Q.forEach(q=>m[q[0]]=(m[q[0]]||0)+1);$('topics').innerHTML=Object.entries(m).sort().map(([t,n])=>`<button class="card topic" onclick="startTopic(${JSON.stringify(t)})"><b>${t}</b><span>${n} preguntas · tocar para practicar</span></button>`).join('')}function startAll(){let n=+$('num').value;quiz=shuffle(Q);if(n<999)quiz=quiz.slice(0,n);begin('Test general aleatorio')}function startTopic(t){quiz=shuffle(Q.filter(q=>q[0]===t));begin(t)}function begin(t){idx=0;answers=[];chosen=null;$('title').textContent=t;show('quiz');render()}function render(){let q=quiz[idx];chosen=null;$('tag').textContent=q[0];$('counter').textContent=`Pregunta ${idx+1} de ${quiz.length}`;$('bar').style.width=`${(idx+1)/quiz.length*100}%`;$('question').textContent=q[1];$('options').innerHTML=q[2].map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${String.fromCharCode(65+i)}) ${o}</button>`).join('');$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden')}function pick(i,b){chosen=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function check(){if(chosen===null)return alert('Elegí una respuesta.');let q=quiz[idx],ok=chosen===q[3];answers.push({q,chosen,ok});document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('good');if(i===chosen&&!ok)b.classList.add('bad')});$('feedback').innerHTML=`<b>${ok?'✓ Correcto':'✗ Incorrecto'}</b><br>${q[4]}`;$('feedback').classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===quiz.length-1?'Ver resultado':'Siguiente →'}function next(){if(idx<quiz.length-1){idx++;render()}else finish()}function finish(){let n=answers.filter(a=>a.ok).length,p=Math.round(n/answers.length*100);$('score').textContent=`${n}/${answers.length} — ${p}%`;$('scoreText').textContent=p>=80?'Muy buen resultado. Revisá también las correctas dudosas para fijar conceptos.':p>=60?'Vas bien. Conviene revisar los errores y repetir los temas más flojos.':'Conviene repasar las explicaciones y volver a intentar por tema.';show('result');review('all')}function review(mode){let a=answers.filter(x=>mode==='all'||(mode==='bad'&&!x.ok)||(mode==='good'&&x.ok));$('reviews').innerHTML=a.map((x,i)=>`<div class="card"><span class="pill">${x.q[0]}</span><h3>${x.q[1]}</h3><p class="${x.ok?'':'bad'}"><b>Tu respuesta:</b> ${String.fromCharCode(65+x.chosen)}) ${x.q[2][x.chosen]}</p><p><b>Correcta:</b> ${String.fromCharCode(65+x.q[3])}) ${x.q[2][x.q[3]}</p><div class="explain"><b>Por qué:</b> ${x.q[4]}</div></div>`).join('')||'<div class="card">No hay preguntas en esta categoría.</div>'}function home(){show('home');renderTopics()}renderTopics();</script></body></html>

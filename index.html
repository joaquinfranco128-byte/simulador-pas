<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simulador PAS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#08111f;color:#eaf2ff}.wrap{max-width:900px;margin:auto;padding:18px}.hero{padding:18px 0}.hero h1{margin:0;font-size:28px}.muted{color:#9fb0c8}.card{background:#111d2f;border:1px solid #263a55;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.topic{cursor:pointer;text-align:left;color:#fff}.topic b{display:block;font-size:16px}.topic span{font-size:13px;color:#aab9ce}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:#38bdf8;color:#062033}.btn.secondary{background:#1d2c42;color:#eaf2ff;border:1px solid #334b69}.btn.green{background:#4ade80}.btn.red{background:#fb7185}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.opt{width:100%;display:block;text-align:left;background:#17263a;color:#eaf2ff;border:1px solid #324861;border-radius:13px;padding:14px;margin:9px 0;font-size:15px}.opt.sel{outline:2px solid #38bdf8}.opt.good{background:#123a2a;border-color:#4ade80}.opt.bad{background:#431b2a;border-color:#fb7185}.pill{display:inline-block;background:#1c3049;border-radius:99px;padding:6px 10px;font-size:12px;margin:2px}.progress{height:8px;background:#1c2a3d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#38bdf8}.explain{background:#0d2940;border-left:4px solid #38bdf8;padding:12px;border-radius:8px;margin-top:10px;line-height:1.45}.review{border-top:1px solid #2b405b;padding-top:14px;margin-top:14px}.ok{color:#4ade80}.no{color:#fb7185}select{background:#17263a;color:white;border:1px solid #334b69;border-radius:10px;padding:11px;font-size:16px}.big{font-size:38px;font-weight:800}.sticky{position:sticky;bottom:0;background:#08111fee;padding:10px 0}</style></head><body><div class="wrap"><section id="home"><div class="hero"><h1>Simulador PAS</h1><p class="muted">Banco revisado por tema · explicaciones · repaso de correctas e incorrectas</p></div><div class="card"><h2>Test aleatorio general</h2><p class="muted">Mezcla preguntas de todos los temas.</p><div class="row"><select id="nGeneral"><option>10</option><option selected>20</option><option>30</option><option>40</option><option value="999">Todas</option></select><button class="btn" onclick="startAll()">Empezar test aleatorio</button></div></div><h2>Practicar por tema</h2><div id="topics" class="grid"></div></section><section id="quiz" class="hidden"><div class="row"><button class="btn secondary" onclick="goHome()">← Salir</button><span id="qtopic" class="pill"></span></div><h2 id="qtitle"></h2><div class="progress"><i id="bar"></i></div><p id="counter" class="muted"></p><div class="card"><h3 id="qtext"></h3><div id="opts"></div><div id="feedback" class="hidden explain"></div></div><div class="sticky row"><button id="check" class="btn" onclick="checkAnswer()">Corregir</button><button id="next" class="btn green hidden" onclick="nextQ()">Siguiente</button></div></section><section id="result" class="hidden"><button class="btn secondary" onclick="goHome()">← Inicio</button><div class="card"><div id="score" class="big"></div><p id="scoreText"></p><div class="row"><button class="btn" onclick="review('all')">Revisar todas</button><button class="btn red" onclick="review('bad')">Solo errores</button><button class="btn secondary" onclick="review('good')">Solo correctas</button></div></div><div id="review"></div></section></div><script>
const Q=[
['Marco legal','La Ley 20.091 regula principalmente:',['El contrato entre asegurado y asegurador','La actividad y funcionamiento de las entidades aseguradoras','Solo la matrícula del PAS','La seguridad vial'],1,'La Ley 20.091 regula a las entidades aseguradoras y su control; la Ley 17.418 regula el contrato de seguro y la 22.400 la actividad del PAS.'],
['Marco legal','La Superintendencia de Seguros de la Nación ejerce el control de la actividad aseguradora como:',['Entidad autárquica dependiente del Poder Ejecutivo Nacional','Dependencia del Banco Central','Sociedad anónima estatal','Organismo privado'],0,'El material define a la SSN como entidad autárquica dependiente del Poder Ejecutivo Nacional, con competencia de control sobre la actividad aseguradora.'],
['Aseguradoras y SSN','Si la pérdida del capital mínimo de una aseguradora alcanza el 30%, la SSN puede ordenar:',['La liquidación automática','Abstenerse de celebrar nuevos contratos hasta alcanzar el capital mínimo','Duplicar las primas','Transferir todas las pólizas al Estado'],1,'El material vincula la pérdida del 30% del capital mínimo con la orden de abstenerse de celebrar nuevos contratos en todas o algunas ramas hasta regularizarse.'],
['Aseguradoras y SSN','Como regla del material, las inversiones y disponibilidades de las aseguradoras deben estar:',['Radicadas en la República Argentina','En cualquier país del Mercosur','Solo en Estados Unidos','Exclusivamente en bancos públicos'],0,'El Reglamento citado establece la radicación en Argentina, con excepciones específicas autorizadas.'],
['Aseguradoras y SSN','¿Cuál es una finalidad del Plan de Regularización y Saneamiento?',['Ocultar el déficit hasta el cierre','Superar la situación deficitaria protegiendo también a asegurados, beneficiarios y damnificados','Eliminar las reservas técnicas','Suspender todas las matrículas PAS'],1,'El plan busca recomponer la situación patrimonial sin descuidar la tutela de asegurados, beneficiarios y damnificados.'],
['PAS - Ley 22.400','La función principal de la actividad del Productor Asesor de Seguros es:',['Liquidar siniestros judicialmente','Intermediar y asesorar a asegurados y asegurables','Fijar las primas de todas las compañías','Fiscalizar a la SSN'],1,'El art. 1 de la Ley 22.400, según el material, caracteriza la actividad como intermediación cuya función principal es el asesoramiento.'],
['PAS - Ley 22.400','¿Quién puede percibir comisión por gestiones de concertación de seguros?',['Cualquier vendedor','Una persona inscripta en el registro correspondiente','Solo empleados de aseguradoras','Cualquier familiar de un PAS'],1,'El material remarca que las personas físicas no inscriptas no tienen derecho a comisión y las aseguradoras deben abstenerse de operar con ellas.'],
['PAS - Ley 22.400','El derecho del PAS a cobrar comisión se adquiere, como regla, cuando:',['Entrega la propuesta','La aseguradora percibe efectivamente la prima o la cuota','El cliente pide cotización','Se imprime la póliza'],1,'El art. 6 citado vincula el derecho a comisión con la percepción efectiva de la prima por la aseguradora.'],
['PAS - Ley 22.400','Actualmente, para mantener la matrícula vigente el material menciona entre otros requisitos:',['Pago del derecho anual y Registro de Operaciones mediante Rúbrica Digital','Tener 100 pólizas por año','Ser empleado de una aseguradora','Presentar balance mensual'],0,'El material enumera el derecho anual, domicilio declarado y Registro de Operaciones bajo Rúbrica Digital, entre otros deberes.'],
['PAS - Ley 22.400','Si una matrícula está suspendida conforme al régimen citado, el PAS:',['Puede seguir intermediando normalmente','Está impedido de ejercer la actividad propia de intermediación','Solo puede vender vida','Puede cobrar nuevas comisiones sin operar'],1,'Durante la suspensión no puede ejercer la actividad propia referente a contratos de seguros.'],
['Contrato - Ley 17.418','La reticencia consiste en:',['Solo no pagar la prima','Una declaración falsa u omisión de circunstancias conocidas que habrían impedido el contrato o modificado sus condiciones','Denunciar tarde un siniestro','Contratar dos seguros'],1,'La definición del art. 5 reproducida en el material contempla declaración falsa o reticencia de circunstancias conocidas relevantes para la aceptación o condiciones del riesgo.'],
['Contrato - Ley 17.418','¿Qué plazo menciona el material para que el asegurador impugne el contrato desde que conoce la reticencia o falsedad?',['3 días','30 días','3 meses','1 año'],2,'El material reproduce que el asegurador debe impugnar el contrato dentro de los tres meses de haber conocido la reticencia o falsedad.'],
['Contrato - Ley 17.418','En Primer Riesgo Absoluto, la indemnización:',['Siempre aplica regla proporcional','Cubre el daño hasta la suma asegurada sin aplicar infraseguro proporcional','Nunca puede cubrir un daño total','Depende del valor fiscal'],1,'En esta medida se indemniza el daño hasta la suma asegurada, sin aplicar la regla proporcional por infraseguro.'],
['Contrato - Ley 17.418','En una cobertura a prorrata existe infraseguro. ¿Qué ocurre?',['Se aumenta automáticamente la suma','La indemnización se reduce proporcionalmente','El contrato siempre es nulo','Se paga siempre el daño completo'],1,'La prorrata aplica proporcionalidad cuando la suma asegurada es inferior al valor asegurable.'],
['Siniestros','Si el asegurador rechaza un siniestro, el material indica que el rechazo debe:',['Ser verbal','Notificarse fehacientemente y con fundamentos claros','Hacerse solo al PAS','Esperar un año'],1,'El rechazo debe comunicarse de manera fehaciente y fundarse claramente.'],
['Siniestros','Los gastos necesarios para verificar el siniestro y liquidar el daño corresponden, como regla, a:',['El asegurador','El PAS','El tercero damnificado','El municipio'],0,'La verificación y liquidación forman parte del proceso a cargo del asegurador, salvo supuestos específicos derivados de información falsa.'],
['Siniestros','La carga de salvamento implica que el asegurado debe:',['Abandonar siempre los restos','Tomar medidas razonables para evitar o disminuir el daño','Pagar una prima adicional','Esperar instrucciones sin actuar'],1,'La carga de salvamento exige actuar para evitar o disminuir el daño cuando ello sea posible.'],
['Robo','La diferencia central entre robo y hurto es que el robo:',['Siempre ocurre de noche','Supone fuerza en las cosas o violencia en las personas','Solo afecta dinero','Requiere un arma de fuego'],1,'El material, siguiendo el Código Penal, distingue el robo por la fuerza en las cosas o violencia en las personas; el hurto carece de ellas.'],
['Robo','En Robo de Contenido General, el material indica que las medidas de prestación posibles incluyen:',['Solo prorrata','Prorrata, Primer Riesgo Absoluto y Primer Riesgo Relativo','Solo valor tasado','Ninguna medida'],1,'El módulo enumera expresamente las tres medidas de prestación.'],
['Robo','Si un objeto asegurado ya no se fabrica, para determinar el resarcimiento el material propone considerar:',['Siempre cero','El valor de un modelo similar en condiciones comparables de uso y antigüedad','El precio original sin ajuste','El valor sentimental'],1,'Se toma como referencia un modelo comparable en condiciones similares de uso y antigüedad.'],
['Incendio','La cobertura de incendio puede contemplar:',['Solo daños de la llama','Daños directos y determinados daños indirectos vinculados al evento','Solo responsabilidad civil','Únicamente explosiones'],1,'El módulo desarrolla daños directos e indirectos y ampliaciones del riesgo cubierto, no se limita al contacto directo de la llama.'],
['Incendio','Una pared dañada razonablemente al combatir un incendio puede encuadrar como:',['Daño vinculado a medidas de salvamento/extinción','Hurto','Reticencia','Daño de tránsito'],0,'Las medidas razonables para extinguir o limitar el fuego pueden generar daños indemnizables conforme a las condiciones de incendio.'],
['Responsabilidad Civil','Ser civilmente responsable significa, en términos del material:',['Estar obligado a reparar el perjuicio causado a otro','Tener siempre responsabilidad penal','Ser dueño de una aseguradora','Pagar una multa a la SSN'],0,'El eje de la responsabilidad civil es la obligación de reparar el daño causado a otra persona.'],
['Responsabilidad Civil','La teoría del riesgo desplaza el foco exclusivo de la culpa y pone relevancia en:',['Quien introduce una cosa o actividad apta para causar daños','Solo la víctima','El PAS','La autoridad municipal'],0,'El material explica la objetivación de la responsabilidad: quien introduce un riesgo apto para causar perjuicios puede quedar obligado a soportar sus consecuencias.'],
['Automotores','Vehículos Expuestos a Riesgo refiere a:',['Cantidad de vehículos vendidos','Cantidad equivalente de vehículos asegurados durante el período analizado según días de cobertura','Cantidad de choques','Autos sin seguro'],1,'El módulo lo define mediante los días de cobertura de cada vehículo sobre los días del período.'],
['Automotores','Participar en certámenes o pruebas de velocidad puede constituir:',['Una ampliación automática','Una exclusión de cobertura según las condiciones del seguro','Una franquicia','Una forma de salvamento'],1,'Las condiciones de automotores contemplan exclusiones relacionadas con competencias o pruebas de velocidad.'],
['Automotores','La franquicia es:',['La parte del daño que queda a cargo del asegurado según contrato','Una comisión del PAS','Un impuesto','El capital mínimo'],0,'La franquicia delimita la parte del daño que no asume el asegurador y queda a cargo del asegurado.'],
['Aeronavegación','En el seguro de casco aeronáutico del material, la pérdida total se considera cuando los daños superan aproximadamente:',['25%','50%','85%','100% exclusivamente'],2,'El módulo indica pérdida total cuando los daños superan el 85% del valor de la aeronave.'],
['Aeronavegación','El material también considera pérdida total de una aeronave cuando:',['No hay noticias durante tres meses','No vuela durante una semana','Cambia de hangar','Se vende'],0,'El resumen del módulo contempla desaparición por tres meses como supuesto de pérdida total.'],
['Aeronavegación','Una aeronave sin certificado de aeronavegabilidad aparece en el material como:',['Cobertura adicional','Exclusión de cobertura','Franquicia opcional','Beneficio del asegurado'],1,'El módulo la enumera entre las exclusiones del casco aeronáutico.'],
['Embarcaciones','En embarcaciones de placer, navegar fuera del área permitida en póliza figura como:',['Exclusión','Cobertura automática','Salvamento','Reaseguro'],0,'El módulo enumera como exclusión los siniestros ocurridos fuera del área de navegación permitida.'],
['Embarcaciones','¿Cuál aparece como cobertura adicional para embarcaciones de placer?',['Robo del motor fuera de borda','Cualquier acto doloso del dueño','Radiación nuclear','Todo uso lucrativo sin declarar'],0,'El material enumera el robo del motor fuera de borda entre los adicionales.'],
['Seguros integrales','En un Integral de Hoteles, por existir bienes de pasajeros:',['Nunca se aseguran','Se contemplan coberturas específicas para bienes y valores de huéspedes','Solo responde el PAS','Se elimina incendio'],1,'El módulo destaca coberturas específicas para bienes de huéspedes, valores, incendio y otros riesgos propios de hoteles.'],
['Seguros integrales','¿Cuál es una cobertura típica mencionada para Integral de Hoteles?',['RC Comprensiva','Seguro agrícola de granizo','ART del huésped','Casco marítimo'],0,'El material incluye Responsabilidad Civil Comprensiva entre las coberturas del integral hotelero.'],
['Ética y prevención','El papel del PAS en cultura de prevención incluye:',['Vender con la verdad y asesorar sobre riesgos y sumas aseguradas','Ocultar exclusiones','Evitar capacitarse','Limitarse a cobrar'],0,'El material destaca prevención, capacitación, detección de riesgos, asesoramiento claro y venta con la verdad.'],
['Ética y prevención','La prevención debería integrarse en la actividad del PAS como:',['Una tarea excepcional','Parte de la actividad diaria y del asesoramiento','Una obligación exclusiva de bomberos','Un trámite contable'],1,'El módulo plantea integrar la prevención a la actividad diaria y posicionar al PAS como administrador de riesgos.'],
['Fraude','Existe fraude en seguros cuando:',['Hay un error involuntario','Se realiza un engaño o maniobra fraudulenta buscando un beneficio indebido','El siniestro es grande','La aseguradora pide documentación'],1,'El módulo define fraude por engaño consciente orientado a obtener un provecho ilícito perjudicando a otra parte.'],
['Fraude','Provocar intencionalmente un siniestro para cobrar es:',['Fraude en seguros','Salvamento','Coaseguro','Subrogación'],0,'El material lo enumera expresamente como una modalidad de fraude en seguros.'],
['Fraude','Una diferencia significativa entre lo reclamado y lo finalmente liquidado:',['Constituye fraude automáticamente','No constituye fraude por sí sola','Obliga a denunciar penalmente siempre','Anula toda póliza'],1,'El módulo aclara que una diferencia entre lo reclamado y la liquidación no basta por sí sola para configurar fraude.'],
['Defensa del asegurado','El asegurado, en la contratación de seguros, puede quedar comprendido como:',['Consumidor de un servicio','Funcionario público','Reasegurador','Perito'],0,'El módulo explica que el seguro es un servicio y que el asegurado queda comprendido en el Derecho del Consumo.'],
['Defensa del asegurado','El artículo 42 de la Constitución Nacional es relevante porque:',['Consagra protección de consumidores y usuarios','Regula exclusivamente ART','Crea la SSN','Fija comisiones PAS'],0,'El módulo vincula el art. 42 CN con la protección constitucional del consumidor y usuario.'],
['Seguridad vial','Según la Ley Nacional de Tránsito citada, accidente de tránsito es:',['Solo un choque entre dos autos','Todo hecho que produzca daño en personas o cosas como consecuencia de la circulación','Solo un hecho con fallecidos','Cualquier avería mecánica'],1,'El módulo reproduce la definición del art. 64: hecho que produzca daño en personas o cosas como consecuencia de la circulación.'],
['Seguridad vial','El PAS frente a la seguridad vial debe:',['Promover prevención y concientización','Ignorarla porque no forma parte del seguro','Aplicar multas','Otorgar licencias de conducir'],0,'El temario asigna al PAS un rol de concientización y prevención en seguridad vial.'],
['Contabilidad','La contabilidad sirve principalmente para:',['Medir, registrar, comparar y analizar la realidad económica y financiera','Fijar sentencias judiciales','Emitir licencias','Calcular solo comisiones'],0,'El módulo la presenta como sistema de gestión, administración y control de ingresos, gastos y operaciones para apoyar decisiones.'],
['Contabilidad','Uno de los objetivos de presentar información contable clara es:',['Facilitar dirección, control y planificación','Ocultar obligaciones','Evitar comprobantes','Eliminar controles externos'],0,'El material resalta que la información clara y sistemática facilita dirección, control y planificación futura.'],
['Vida','Según el material de Vida, una reticencia dolosa sobre una enfermedad preexistente puede:',['Ser irrelevante siempre','Dar lugar a nulidad del contrato conforme al régimen explicado','Transformar el seguro en ART','Duplicar automáticamente el capital'],1,'El módulo de Vida ejemplifica la reticencia dolosa con la no declaración de una enfermedad preexistente y explica sus efectos sobre la validez del contrato.'],
['Vida','Según el módulo de Vida, presentada la documentación requerida, el pago de la indemnización a beneficiarios se realiza dentro de:',['3 días','15 días','30 días','90 días'],1,'El material de Vida indica un plazo de 15 días desde la presentación de la documentación requerida.'],
['PAS - Ley 22.400','Un Productor Asesor Organizador percibe comisión como organizador por:',['Cualquier operación del mercado','Operaciones en que intervinieron productores directos a los que asiste','Solo pólizas propias','Operaciones de personas no matriculadas'],1,'El material señala que el PAO percibe comisión por operaciones en que intervinieron los PAS directos a los que asiste; en producción propia puede hacerlo en doble carácter.'],
['Aseguradoras y SSN','¿Cuál es un mecanismo posible dentro de un plan de saneamiento?',['Aporte de capital','Eliminar todas las pólizas sin aviso','Dejar de constituir reservas','Transferir la SSN al BCRA'],0,'Entre los mecanismos mencionados están aportes de capital, fusión, administración con opción a compra o fusión y cesión de cartera.'],
['Robo','El hurto se caracteriza por:',['Apoderamiento sin fuerza en las cosas ni violencia en las personas','Uso obligatorio de armas','Violencia física siempre','Daño por incendio'],0,'A diferencia del robo, el hurto supone apoderamiento ilegítimo sin fuerza en las cosas ni violencia en las personas.'],
['Fraude','Simular falsamente un siniestro con intención de cobrar:',['Es fraude en seguros','Es reticencia no dolosa','Es una franquicia','Es una práctica admitida'],0,'La simulación falsa del siniestro para obtener un beneficio aparece expresamente como fraude.']
];
let test=[],idx=0,sel=null,answers=[];const $=id=>document.getElementById(id);const topics=[...new Set(Q.map(q=>q[0]))].sort();
function renderTopics(){ $('topics').innerHTML=topics.map(t=>{let n=Q.filter(q=>q[0]==t).length;return `<button class="card topic" onclick="startTopic(${JSON.stringify(t)})"><b>${t}</b><span>${n} preguntas · practicar</span></button>`}).join('') }renderTopics();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function begin(arr){test=shuffle(arr);idx=0;answers=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQ()}
function startAll(){let n=+$('nGeneral').value;begin(shuffle(Q).slice(0,Math.min(n,Q.length)))}function startTopic(t){begin(Q.filter(q=>q[0]===t))}
function showQ(){sel=null;let q=test[idx];$('qtopic').textContent=q[0];$('qtitle').textContent='Pregunta '+(idx+1);$('counter').textContent=`${idx+1} de ${test.length}`;$('bar').style.width=((idx)/test.length*100)+'%';$('qtext').textContent=q[1];$('opts').innerHTML=q[2].map((o,i)=>`<button class="opt" onclick="pick(${i},this)"><b>${String.fromCharCode(65+i)})</b> ${o}</button>`).join('');$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden')}
function pick(i,e){if(!$('next').classList.contains('hidden'))return;sel=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));e.classList.add('sel')}
function checkAnswer(){if(sel===null){alert('Elegí una respuesta primero');return}let q=test[idx],ok=sel===q[3];answers.push({q,sel,ok});document.querySelectorAll('.opt').forEach((e,i)=>{e.classList.remove('sel');if(i===q[3])e.classList.add('good');else if(i===sel)e.classList.add('bad')});$('feedback').innerHTML=`<b>${ok?'✓ Correcta':'✗ Incorrecta'}</b><br>${q[4]}`;$('feedback').classList.remove('hidden');$('check').classList.add('hidden');$('next').textContent=idx===test.length-1?'Ver resultado':'Siguiente';$('next').classList.remove('hidden')}
function nextQ(){idx++;if(idx>=test.length)return finish();showQ()}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let ok=answers.filter(a=>a.ok).length,p=Math.round(ok/answers.length*100);$('score').textContent=p+'%';$('scoreText').textContent=`${ok} correctas de ${answers.length}. Podés revisar también las que acertaste para entender por qué.`;$('review').innerHTML=''}
function review(mode){let a=answers.filter(x=>mode==='all'||(mode==='bad'&&!x.ok)||(mode==='good'&&x.ok));$('review').innerHTML=a.length?a.map((x,k)=>`<div class="card review"><span class="pill">${x.q[0]}</span><h3>${x.q[1]}</h3><p class="${x.ok?'ok':'no'}"><b>Tu respuesta:</b> ${x.q[2][x.sel]}</p><p class="ok"><b>Correcta:</b> ${x.q[2][x.q[3]]}</p><div class="explain"><b>Por qué:</b> ${x.q[4]}</div></div>`).join(''):'<div class="card">No hay preguntas en este filtro.</div>'}
function goHome(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden');scrollTo(0,0)}
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador PAS</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:24px}#msg{max-width:700px;margin:10vh auto;background:#111827;border:1px solid #334155;border-radius:16px;padding:24px}</style></head><body><div id="msg">Cargando simulador...</div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(n=>fetch(`p${n}.txt`).then(r=>{if(!r.ok)throw new Error('No se pudo cargar p'+n);return r.text()})));const b=atob(parts.join(''));const u=Uint8Array.from(b,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('msg').innerHTML='<h2>No se pudo cargar el simulador</h2><p>'+e.message+'</p>'}})();</script></body></html>
